name: Chromatic
# Visual regression on pull requests. Needs the CHROMATIC_PROJECT_TOKEN secret; skipped without it.
on: [pull_request]
jobs:
  visual:
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --exit-zero-on-changes
        working-directory: apps/storybook
