name: Release
# Push a tag like v4.4.0 → tests run → @jirawatpyk/aura-tokens and @jirawatpyk/aura-react are published to GitHub Packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@jirawatpyk'
      - run: npm ci
      - name: Tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/tokens packages/react; do
            V=$(node -p "require('./$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "$p is $V but the tag is $TAG"; exit 1; }
          done
      - run: npm test
      - run: npm run build
      - run: npm publish -w packages/tokens -w packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
