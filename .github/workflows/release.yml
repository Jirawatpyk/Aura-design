name: Release
# Push a tag like v4.4.1 → tests run → @jirawatpyk/aura-tokens and @jirawatpyk/aura-react are published twice:
#   GitHub Packages (npm.pkg.github.com) — internal projects, uses GITHUB_TOKEN;
#   npmjs (registry.npmjs.org, public)   — anyone, no token needed to install.
# npmjs auth: trusted publishing (OIDC) — no secret stored anywhere.
# A prerelease version (4.5.0-rc.1) is published under the `next` dist-tag on both registries.
# A version already on a registry is skipped, so a failed run can simply be re-run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write   # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - name: Tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in packages/tokens packages/react; do
            V=$(node -p "require('./$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "$p is $V but the tag is $TAG"; exit 1; }
          done
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run -w packages/tokens -w packages/react 2>&1 | tail -40

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RC="$RUNNER_TEMP/github.npmrc"
          printf '@jirawatpyk:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RC"
          for p in packages/tokens packages/react; do
            N=$(node -p "require('./$p/package.json').name"); V=$(node -p "require('./$p/package.json').version")
            if npm view "$N@$V" version --userconfig "$RC" --registry https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "::notice::$N@$V is already on GitHub Packages — skipped"; continue
            fi
            case "$V" in *-*) TAG=next ;; *) TAG=latest ;; esac
            npm publish -w "$p" --userconfig "$RC" --registry https://npm.pkg.github.com --tag "$TAG"
          done

      - name: Publish to npmjs (public, trusted publishing)
        # No token: npm exchanges this job's OIDC identity for a one-time publish credential.
        # npmjs.com → each package → Settings → Trusted Publisher: Jirawatpyk/Aura-design, release.yml.
        run: |
          for p in packages/tokens packages/react; do
            N=$(node -p "require('./$p/package.json').name"); V=$(node -p "require('./$p/package.json').version")
            if npm view "$N@$V" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "::notice::$N@$V is already on npmjs — skipped"; continue
            fi
            case "$V" in *-*) TAG=next ;; *) TAG=latest ;; esac
            npm publish -w "$p" --registry https://registry.npmjs.org --access public --provenance --tag "$TAG"
          done
